<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✏️ 今天吃什麼？(v9.1 穩定回退版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFBE6; --line-color: #4A3F35;
            --accent-yellow: #FFEF9F; --accent-pink: #FFC4C4; --accent-blue: #C4E4FF; --accent-green: #C7EDB6;
            --disabled-gray: #e0e0e0; --disabled-text: #888;
            --danger-red: #d9534f; --success-green: #28a745;
            --paper-shadow: rgba(0, 0, 0, 0.15);
            --sticker-shadow: rgba(0, 0, 0, 0.25);
            --sticker-shadow-deep: rgba(0, 0, 0, 0.35);
        }
        body {
            font-family: 'Patrick Hand', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--line-color) 0.5px, transparent 0.5px);
            background-size: 20px 20px; color: var(--line-color);
            margin: 0 auto; padding: 20px 15px; max-width: 500px;
            padding-bottom: 120px;
            overflow-x: hidden;
        }
        h1, h2, h3 { font-weight: normal; text-align: center; margin: 10px 0; }
        
        .hand-drawn-box {
            background: white;
            border-radius: 20px;
            outline: 3px dashed var(--line-color); outline-offset: -5px;
            border: 4px solid white;
            box-shadow: 5px 5px 15px var(--paper-shadow);
            padding: 20px; margin-bottom: 30px;
            transform: rotate(-0.5deg);
            transition: all 0.3s;
        }
        
        .input-section { background: var(--accent-blue) !important; transform: rotate(0.5deg); }
        .status-section { background: var(--accent-green) !important; transform: rotate(-0.3deg); }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { 
            display: inline-block; padding: 8px 20px; margin-bottom: 10px;
            background: var(--accent-yellow); border-radius: 15px 25px 15px 25px;
            outline: 3px dashed var(--line-color); border: 3px solid white;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.1); transform: rotate(-1deg);
        }
        .restaurant-name { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; margin-top: 15px;}
        .menu-time-info { font-size: 0.85rem; color: #666; margin-bottom: 10px;}

        .map-link-btn {
            display: inline-block; text-decoration: none; color: white; font-weight: bold;
            background-color: var(--line-color);
            padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; margin-top: 5px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            transition: all 0.1s;
        }
        .map-link-btn:active { transform: translate(1px, 1px); box-shadow: none; }

        .deadline-banner {
            background-color: var(--accent-pink) !important; transform: rotate(0.5deg);
            text-align: center; padding: 15px; margin-bottom: 30px;
        }
        .deadline-title { font-size: 1.3rem; font-weight: bold; margin: 0 0 10px 0; }
        .deadline-full-date { font-size: 1rem; margin-bottom: 5px; }
        .countdown-timer { font-size: 1.5rem; font-weight: bold; color: var(--danger-red); background: white; padding: 5px 15px; border-radius: 10px; border: 2px solid var(--line-color); display: inline-block; margin-top: 5px;}
        .countdown-ended { color: var(--disabled-text); background: #eee; border-color: #aaa;}

        .price-note-up { color: var(--danger-red); font-size: 0.85rem; margin-left: 3px; font-weight: bold;}
        .price-note-down { color: var(--success-green); font-size: 0.85rem; margin-left: 3px; font-weight: bold;}

        body.order-closed .hand-drawn-box {
            opacity: 0.8; filter: grayscale(0.8); pointer-events: none;
            outline: 3px solid #aaa !important; border-radius: 10px !important; 
            transform: none !important; box-shadow: none !important;
        }

        .category-title {
            text-align: left; font-size: 1.1rem; font-weight: bold; 
            margin: 25px 0 15px 0; display: inline-block; padding: 8px 15px;
            background: var(--accent-yellow); 
            outline: 2px dashed var(--line-color); border: 3px solid white;
            border-radius: 10px 20px 10px 20px;
            box-shadow: 3px 3px 5px var(--paper-shadow); transform: rotate(-1deg);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            padding: 5px;
        }
        
        .menu-item-checkbox {
            background: white; overflow: visible;
            transition: all 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: 2px dashed var(--line-color); outline-offset: -2px;
            border: 3px solid white; border-radius: 15px;
            opacity: 0;
            transform: translateY(30px) scale(0.9); 
            box-shadow: none;
            display: flex; flex-direction: column;
        }

        .menu-item-checkbox.show {
            opacity: 1;
            transform: translateY(0) scale(1) rotate(-1deg) skewX(-1deg);
            box-shadow: 6px 6px 12px var(--sticker-shadow);
        }

        .menu-item-header { display: flex; align-items: center; padding: 10px; cursor: pointer; flex-grow: 1; }

        .food-icon-wrapper {
            width: 36px; height: 36px; font-size: 1.6rem; margin-right: 8px;
            background: #fff; outline: 2px dashed var(--line-color); border: 2px solid white;
            border-radius: 50% 45% 55% 50% / 50% 55% 45% 50%;
            transform: rotate(-3deg); flex-shrink: 0;
            box-shadow: 2px 2px 4px var(--paper-shadow);
        }

        .menu-item-checkbox.selected { 
            background: var(--accent-yellow); 
            outline: 3px solid var(--line-color);
            transform: scale(1.05) translateY(-8px) rotate(-2deg) skewX(-2deg) !important; 
            box-shadow: 10px 10px 20px var(--sticker-shadow-deep) !important;
            z-index: 5;
        }

        .menu-item-checkbox:active {
            transform: scale(0.98) rotate(-0.5deg) skewX(-0.5deg) !important;
            box-shadow: 3px 3px 6px var(--sticker-shadow) !important;
        }

        .checkbox-square {
            width: 18px; height: 18px; border: 2px solid var(--line-color); margin-right: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; background: white;
            border-radius: 4px;
        }
        .menu-item-checkbox.selected .checkbox-square { background: white; color: var(--line-color);}
        .menu-item-checkbox.selected .checkbox-square::after { content: '✓'; }
        .food-info { flex-grow: 1; font-size: 1rem; display: flex; flex-wrap: wrap; align-items: center; line-height: 1.2;}
        .food-info b { margin-left: 5px; font-size: 1.1rem;}
        
        .item-details-container {
            display: none; padding: 10px; background: rgba(255,255,255,0.5);
            border-top: 2px dashed var(--line-color);
            border-radius: 0 0 15px 15px;
        }
        .menu-item-checkbox.selected .item-details-container { display: block; }
        
        .note-input, input[type="text"] {
            width: 100%; padding: 8px; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; margin-bottom: 10px;
            background: white; outline: 2px dashed var(--line-color); border: 3px solid white;
            border-radius: 8px; box-shadow: 3px 3px 5px var(--paper-shadow);
        }
        .note-input:focus, input[type="text"]:focus { outline: 2px solid var(--line-color); }

        .quantity-controls { display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 0.9rem;}
        .qty-btn { 
            width: 30px; height: 30px; border-radius: 50%; background: white; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
            outline: 2px dashed var(--line-color); border: 2px solid white; box-shadow: 2px 2px 3px var(--paper-shadow);
            transition: all 0.1s;
        }
        .qty-btn:active { background: var(--accent-yellow); transform: scale(0.9); box-shadow: 1px 1px 1px var(--paper-shadow);}

        .user-input-section { padding: 0; }
        
        .avatar-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;}
        .avatar-option {
            width: 48px; height: 48px; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; cursor: pointer;
            background: white; position: relative;
            outline: 2px dashed var(--line-color); border: 3px solid white;
            border-radius: 50%; box-shadow: 3px 3px 6px var(--paper-shadow); transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .avatar-option.selected { 
            background: var(--accent-yellow); outline: 3px solid var(--line-color);
            box-shadow: 6px 6px 0 var(--line-color); transform: scale(1.15) translateY(-5px); z-index: 5;
        }

        .submit-btn-wrapper { position: relative; width: 100%; padding: 5px;}
        .submit-btn {
            position: relative; z-index: 10;
            background: var(--accent-pink); font-family: inherit; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.4rem; padding: 15px;
            outline: 3px dashed var(--line-color); border: none;
            border-radius: 30px 20px 30px 20px;
            transition: all 0.1s; box-shadow: 5px 5px 0 var(--line-color);
        }
        .submit-btn:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--line-color); }

        .status-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed var(--line-color); padding-bottom: 10px; margin-bottom: 10px;}
        .status-item { padding: 10px 5px; border-bottom: 2px dashed rgba(74, 63, 53, 0.2); font-size: 0.95rem; }
        .status-user-row { display: flex; align-items: center; font-weight: bold; margin-bottom: 5px;}
        .status-avatar { font-size: 1.2rem; margin-right: 8px; }
        .status-items-detail { padding-left: 30px; font-size: 0.9rem; opacity: 0.9; }
        .item-note { background: white; padding: 1px 6px; border-radius: 10px; margin-left: 5px; font-size: 0.8rem; color: #555; border: 1px dashed #aaa; display: inline-block;}
    </style>
</head>
<body id="main-body">

    <header>
        <h1>✏️ 今天吃什麼？</h1>
        <div id="restaurant-name-display" class="restaurant-name"></div>
        <div id="restaurant-phone" style="font-size: 0.95rem; margin-bottom: 5px;"></div>
        <div id="map-link-container"></div>
        <div id="menu-time-info" class="menu-time-info" style="margin-top: 10px;"></div>
    </header>

    <section id="deadline-banner" class="hand-drawn-box deadline-banner">
        <h2 class="deadline-title">⏰ 點餐截止時間</h2>
        <div id="deadline-full-date" class="deadline-full-date">載入中...</div>
        <div id="countdown-timer" class="countdown-timer">計算中...</div>
    </section>

    <main id="menu-section" class="hand-drawn-box menu-section">
        <h2>今日菜單 Menu</h2>
        <div id="menu-list-container">
            <p style="text-align: center;">正在載入菜單...</p>
        </div>
        <hr style="border: none; border-top: 3px dashed var(--line-color); margin: 25px 0; opacity: 0.5;">
        <div style="text-align: center; margin-bottom: 10px; font-weight: bold; font-size: 1.2rem;">
            您的選擇總計： $<span id="personal-total">0</span>
        </div>
    </main>

    <section id="input-section" class="hand-drawn-box input-section">
        <div class="user-input-section">
            <h3 style="margin-top: 0;">輪到你點餐了：</h3>
            <input type="text" id="username-input" placeholder="請輸入你的名字 (例如：小陳)">
            
            <p style="text-align: center; margin: 15px 0 10px 0; font-weight: bold; font-size: 1.1rem;">選擇一個頭像貼紙：</p>
            <div class="avatar-selector" id="avatar-selector">
                <div class="avatar-option" onclick="selectAvatar(this, '🐻')">🐻</div>
                <div class="avatar-option" onclick="selectAvatar(this, '🐰')">🐰</div>
                <div class="avatar-option" onclick="selectAvatar(this, '🐱')">🐱</div>
                <div class="avatar-option" onclick="selectAvatar(this, '🐶')">🐶</div>
                <div class="avatar-option" onclick="selectAvatar(this, '🦊')">🦊</div>
                <div class="avatar-option" onclick="selectAvatar(this, '🐷')">🐷</div>
            </div>

            <div class="submit-btn-wrapper">
                <button id="submit-btn" class="submit-btn" disabled>✅ 送出訂單</button>
            </div>
        </div>
    </section>

    <section class="hand-drawn-box status-section">
        <div class="status-header">
            <h2>點餐狀況 (本場次)</h2>
            <span style="font-size: 0.9rem;">(<span id="total-people-count">0</span> 人已點)</span>
        </div>
        <ul id="live-status-list" class="status-list">
            <p style="text-align: center; opacity: 0.7;">目前還沒有人點餐...</p>
        </ul>
    </section>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection, addDoc, query, orderBy, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 🔥🔥🔥 已自動填入您的 firebaseConfig 🔥🔥🔥
        const firebaseConfig = {
          apiKey: "AIzaSyDCDl7YuEixL8T_0Iemjq9soqqgg_fP0yI",
          authDomain: "cute-lunch-order.firebaseapp.com",
          projectId: "cute-lunch-order",
          storageBucket: "cute-lunch-order.firebasestorage.app",
          messagingSenderId: "62115069448",
          appId: "1:62115069448:web:212231a6452f87a3d69bbd",
          measurementId: "G-DWMWFSHQPX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM
        const mainBody = document.getElementById('main-body');
        const menuContainer = document.getElementById('menu-list-container');
        const restaurantNameDisplay = document.getElementById('restaurant-name-display');
        const menuTimeInfoDisplay = document.getElementById('menu-time-info');
        const restaurantPhoneDisplay = document.getElementById('restaurant-phone');
        const usernameInput = document.getElementById('username-input');
        const submitBtn = document.getElementById('submit-btn');
        const personalTotalDisplay = document.getElementById('personal-total');
        const liveStatusList = document.getElementById('live-status-list');
        const totalPeopleCountSpan = document.getElementById('total-people-count');
        const mapLinkContainer = document.getElementById('map-link-container');
        const deadlineBanner = document.getElementById('deadline-banner');
        const deadlineFullDateDisplay = document.getElementById('deadline-full-date');
        const countdownTimerDisplay = document.getElementById('countdown-timer');

        let selectedAvatarChar = null;
        let currentSelectionsMap = new Map();
        let currentSessionId = null;
        let unsubscribeOrders = null;
        let isManualClosed = false;
        let deadlineDate = null;
        let checkTimeInterval = null;
        let countdownInterval = null;
        let priceChangeMap = new Map(); 
        let globalItemIndex = 0;

        // --- A. 監聽菜單資訊與狀態 ---
        onSnapshot(doc(db, "dailyData", "menu"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                restaurantNameDisplay.textContent = data.restaurantName || '今日餐廳';
                restaurantPhoneDisplay.textContent = data.restaurantPhone ? `📞 電話: ${data.restaurantPhone}` : '';
                
                if (data.restaurantMapUrl) {
                    mapLinkContainer.innerHTML = `<a href="${data.restaurantMapUrl}" target="_blank" class="map-link-btn">🗺️ 去 Google Maps 看照片</a>`;
                } else {
                    mapLinkContainer.innerHTML = '';
                }

                let timeInfoHtml = '';
                if (data.updatedAt) {
                    const updateTime = new Date(data.updatedAt.seconds * 1000).toLocaleString('zh-TW', {hour: '2-digit', minute:'2-digit'});
                    timeInfoHtml += `菜單更新於: ${updateTime}`;
                }
                menuTimeInfoDisplay.innerHTML = timeInfoHtml;

                if (data.deadlineTimestamp) {
                    deadlineDate = data.deadlineTimestamp.toDate();
                    deadlineFullDateDisplay.textContent = deadlineDate.toLocaleString('zh-TW', {year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false});
                    deadlineBanner.style.display = 'block';
                } else {
                    deadlineDate = null;
                    deadlineFullDateDisplay.textContent = '(未設定)';
                    deadlineBanner.style.display = 'none';
                }

                isManualClosed = data.isOrderClosed === true;
                
                startCountdown();
                checkFormLockState();
                
                if (checkTimeInterval) clearInterval(checkTimeInterval);
                checkTimeInterval = setInterval(checkFormLockState, 30000);

                processPriceChanges(data.comparisonSummary);
                renderMenu(data);
                
                currentSessionId = data.sessionId;
                if (currentSessionId) {
                    setupOrderListener(currentSessionId);
                }
            } else {
                menuContainer.innerHTML = '<p style="text-align: center;">今日尚未發布菜單...</p>';
                deadlineBanner.style.display = 'none';
                mapLinkContainer.innerHTML = '';
                if (checkTimeInterval) clearInterval(checkTimeInterval);
                if (countdownInterval) clearInterval(countdownInterval);
            }
        });

        // 倒數計時功能
        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            if (!deadlineDate) { countdownTimerDisplay.textContent = '---'; return; }
            const updateTimer = () => {
                const now = new Date();
                const diff = deadlineDate - now;
                if (diff <= 0) {
                    countdownTimerDisplay.textContent = '⛔ 已截止';
                    countdownTimerDisplay.classList.add('countdown-ended');
                    clearInterval(countdownInterval);
                    checkFormLockState();
                } else {
                    const hours = Math.floor(diff / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    countdownTimerDisplay.textContent = `剩餘 ${hours.toString().padStart(2, '0')}小時 ${minutes.toString().padStart(2, '0')}分 ${seconds.toString().padStart(2, '0')}秒`;
                    countdownTimerDisplay.classList.remove('countdown-ended');
                }
            };
            updateTimer();
            countdownInterval = setInterval(updateTimer, 1000);
        }


        function processPriceChanges(summary) {
            priceChangeMap.clear();
            if (summary && summary.changedItems) {
                summary.changedItems.forEach(item => {
                    const diff = item.newPrice - item.oldPrice;
                    priceChangeMap.set(item.name, diff);
                });
            }
        }

        function checkFormLockState() {
            let isTimeUp = false;
            if (deadlineDate) {
                const now = new Date();
                if (now >= deadlineDate) isTimeUp = true;
            }
            const shouldLock = isManualClosed || isTimeUp;
            updateFormState(shouldLock, isTimeUp);
        }

        function updateFormState(isLocked, isTimeUp) {
            if (isLocked) {
                mainBody.classList.add('order-closed');
                if (isTimeUp) submitBtn.textContent = '⛔ 時間已到，停止點餐';
                else submitBtn.textContent = '⛔ 已手動結單，停止點餐';
                submitBtn.disabled = true;
                usernameInput.disabled = true;
            } else {
                mainBody.classList.remove('order-closed');
                submitBtn.textContent = '✅ 送出訂單';
                usernameInput.disabled = false;
                checkSubmitButtonState();
            }
        }

        function getIconForDish(dishName) {
            const keywordMap = [
                { keywords: ['雞', 'G', '腿', '排', '翅'], icon: '🍗' },
                { keywords: ['牛', '牛排', '牛肉'], icon: '🥩' },
                { keywords: ['豬', '排骨', '肉絲', '培根', '叉燒', '控肉', '魯肉', '香腸', '肉'], icon: '🐷' },
                { keywords: ['魚', '鰻', '鯖', '鮭', '海鮮'], icon: '🐟' },
                { keywords: ['蝦', '蝦仁', '炸蝦', '捲'], icon: '🍤' },
                { keywords: ['麵', '米粉', '冬粉', '拉麵', '烏龍', '意麵'], icon: '🍜' },
                { keywords: ['飯', '丼', '便當', '粥', '米糕'], icon: '🍚' },
                { keywords: ['堡', '三明治', '吐司', '熱狗'], icon: '🥪' },
                { keywords: ['餃', '鍋貼', '小籠包', '餛飩', '包'], icon: '🥟' },
                { keywords: ['湯', '羹'], icon: '🥣' },
                { keywords: ['菜', '素', '沙拉', '豆', '茄'], icon: '🥬' },
                { keywords: ['炸', '薯條', '雞塊', '這'], icon: '🍟' },
                { keywords: ['咖哩'], icon: '🍛' },
                { keywords: ['蛋', '歐姆'], icon: '🍳' },
                { keywords: ['茶', '咖啡', '飲', '奶', '果汁', '紅茶', '綠茶'], icon: '🥤' },
                { keywords: ['甜', '蛋糕', '點心'], icon: '🍰' },
            ];
            for (const entry of keywordMap) {
                if (entry.keywords.some(keyword => dishName.includes(keyword))) return entry.icon;
            }
            return '🍽️';
        }

        // renderMenu
        function renderMenu(data) {
            menuContainer.innerHTML = '';
            currentSelectionsMap.clear();
            updatePersonalSummary();
            globalItemIndex = 0;

            if (data.menuCategories && Array.isArray(data.menuCategories)) {
                data.menuCategories.forEach(category => {
                    const titleEl = document.createElement('div');
                    titleEl.classList.add('category-title');
                    titleEl.textContent = category.categoryName;
                    menuContainer.appendChild(titleEl);

                    const listEl = document.createElement('div');
                    listEl.classList.add('menu-grid');
                    category.items.forEach(item => {
                        listEl.appendChild(createMenuItemElement(item));
                    });
                    menuContainer.appendChild(listEl);
                });
            } else if (data.menuItems && Array.isArray(data.menuItems)) {
                const listEl = document.createElement('div');
                listEl.classList.add('menu-grid');
                data.menuItems.forEach(item => {
                    listEl.appendChild(createMenuItemElement(item));
                });
                menuContainer.appendChild(listEl);
            } else {
                 menuContainer.innerHTML = '<p>菜單資料格式錯誤或為空。</p>';
            }

            setupScrollAnimations();
        }

        function setupScrollAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('show');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            const menuItems = document.querySelectorAll('.menu-item-checkbox');
            menuItems.forEach(item => {
                observer.observe(item);
            });
        }


        // 建立菜單項目元素
        function createMenuItemElement(item) {
            const el = document.createElement('div');
            el.classList.add('menu-item-checkbox');

            el.style.transitionDelay = `${globalItemIndex * 0.025}s`;
            globalItemIndex++;

            let priceNoteHtml = '';
            if (priceChangeMap.has(item.name)) {
                const diff = priceChangeMap.get(item.name);
                if (diff > 0) {
                    priceNoteHtml = `<span class="price-note-up">(漲${diff})</span>`;
                } else if (diff < 0) {
                    priceNoteHtml = `<span class="price-note-down">(降${Math.abs(diff)})</span>`;
                }
            }

            const dishIcon = getIconForDish(item.name);

            el.innerHTML = `
                <div class="menu-item-header">
                    <div class="food-icon-wrapper">${dishIcon}</div>
                    <div class="food-info">
                        <span>${item.name}</span>
                        <div>
                            <b>$${item.price}</b>${priceNoteHtml}
                        </div>
                    </div>
                    <div class="checkbox-square"></div>
                </div>
                <div class="item-details-container">
                    <div class="quantity-controls" style="margin-bottom: 10px;">
                        <button class="qty-btn minus">-</button>
                        <span>數量: <span class="qty-display">1</span></span>
                        <button class="qty-btn plus">+</button>
                    </div>
                    <input type="text" class="note-input" placeholder="備註 (例如: 加辣)">
                </div>
            `;
            
            const header = el.querySelector('.menu-item-header');
            const noteInput = el.querySelector('.note-input');
            const qtyDisplay = el.querySelector('.qty-display');
            const minusBtn = el.querySelector('.minus');
            const plusBtn = el.querySelector('.plus');

            header.addEventListener('click', () => {
                if (mainBody.classList.contains('order-closed')) return;
                el.classList.toggle('selected');
                if (el.classList.contains('selected')) {
                    currentSelectionsMap.set(item.name, { originalItem: item, noteInputDOM: noteInput, quantityDOM: qtyDisplay });
                    qtyDisplay.textContent = '1';
                } else {
                    currentSelectionsMap.delete(item.name);
                    noteInput.value = ''; 
                }
                updatePersonalSummary();
                checkSubmitButtonState();
            });

            minusBtn.addEventListener('click', (e) => { e.stopPropagation(); changeQuantity(item.name, -1); });
            plusBtn.addEventListener('click', (e) => { e.stopPropagation(); changeQuantity(item.name, 1); });
            return el;
        }

        function changeQuantity(itemName, delta) {
            if (mainBody.classList.contains('order-closed')) return;
            const selection = currentSelectionsMap.get(itemName);
            if (!selection) return;
            let currentQty = parseInt(selection.quantityDOM.textContent);
            let newQty = currentQty + delta;
            if (newQty < 1) newQty = 1;
            selection.quantityDOM.textContent = newQty;
            updatePersonalSummary();
        }

        function updatePersonalSummary() {
            let total = 0;
            currentSelectionsMap.forEach(sel => {
                total += sel.originalItem.price * parseInt(sel.quantityDOM.textContent);
            });
            personalTotalDisplay.textContent = total;
        }

        // --- B. 用戶輸入互動 ---
        window.selectAvatar = (element, char) => {
            if (mainBody.classList.contains('order-closed')) return;
            document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
            element.classList.add('selected');
            selectedAvatarChar = char;
            checkSubmitButtonState();
        }

        function checkSubmitButtonState() {
            if (mainBody.classList.contains('order-closed')) {
                submitBtn.disabled = true; return;
            }
            if (selectedAvatarChar && usernameInput.value.trim() !== '' && currentSelectionsMap.size > 0 && currentSessionId) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }
        usernameInput.addEventListener('input', checkSubmitButtonState);

        // --- C. 送出訂單 ---
        submitBtn.addEventListener('click', async () => {
            if (submitBtn.disabled || mainBody.classList.contains('order-closed')) return;
            if (!currentSessionId) { alert('系統錯誤：無場次 ID'); return; }
            
            const userName = usernameInput.value.trim();
            submitBtn.textContent = '正在送出...';
            submitBtn.disabled = true;

            const itemsToOrder = [];
            let totalCost = 0;
            currentSelectionsMap.forEach(sel => {
                const qty = parseInt(sel.quantityDOM.textContent);
                itemsToOrder.push({
                    name: sel.originalItem.name,
                    price: sel.originalItem.price,
                    note: sel.noteInputDOM.value.trim(),
                    quantity: qty
                });
                totalCost += sel.originalItem.price * qty;
            });

            try {
                await addDoc(collection(db, "todayOrders"), {
                    sessionId: currentSessionId,
                    userName: userName,
                    userAvatar: selectedAvatarChar,
                    items: itemsToOrder,
                    totalCost: totalCost,
                    paidAmount: 0,
                    orderTime: serverTimestamp()
                });
                alert(`✅ ${userName}，訂單送出成功！`);
                window.location.reload(); 
            } catch (e) {
                alert('❌ 訂購失敗：' + e.message);
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ 送出訂單';
            }
        });

        // --- D. 即時監聽點餐狀況 ---
        function setupOrderListener(sessionId) {
            if (unsubscribeOrders) unsubscribeOrders();
            const q = query(collection(db, "todayOrders"), where("sessionId", "==", sessionId), orderBy("orderTime", "desc"));
            unsubscribeOrders = onSnapshot(q, (querySnapshot) => {
                liveStatusList.innerHTML = '';
                totalPeopleCountSpan.textContent = querySnapshot.size;
                if (querySnapshot.empty) { liveStatusList.innerHTML = '<p style="text-align: center; opacity: 0.7;">目前還沒有人點餐...</p>'; return; }
                querySnapshot.forEach((doc) => {
                    const order = doc.data();
                    const li = document.createElement('li');
                    li.classList.add('status-item');
                    let itemsHtml = order.items.map(item => {
                        const noteHtml = item.note ? `<span class="item-note">${item.note}</span>` : '';
                        const qtyHtml = item.quantity > 1 ? ` <b>x${item.quantity}</b>` : '';
                        return `<div>- ${item.name}${qtyHtml} ${noteHtml}</div>`;
                    }).join('');
                    li.innerHTML = `
                        <div class="status-user-row">
                            <span class="status-avatar">${order.userAvatar}</span>
                            <span>${order.userName} (總計: $${order.totalCost})</span>
                        </div>
                        <div class="status-items-detail">${itemsHtml}</div>
                    `;
                    liveStatusList.appendChild(li);
                });
            });
        }
    </script>
</body>
</html>
