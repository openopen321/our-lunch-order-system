<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✏️ 今天吃什麼？(v13.0 美食廣場)</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- 基礎樣式 (維持 v12.0) --- */
        :root {
            --bg-color: #FFFBE6; --line-color: #4A3F35;
            --accent-yellow: #FFEF9F; --accent-pink: #FFC4C4; --accent-blue: #C4E4FF; --accent-green: #C7EDB6;
            --disabled-gray: #e0e0e0; --disabled-text: #888;
            --danger-red: #d9534f; --success-green: #28a745;
            --paper-shadow: rgba(0, 0, 0, 0.15);
            --sticker-shadow: rgba(0, 0, 0, 0.25);
            --sticker-shadow-deep: rgba(0, 0, 0, 0.35);
        }
        body {
            font-family: 'Patrick Hand', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--line-color) 0.5px, transparent 0.5px);
            background-size: 20px 20px; color: var(--line-color);
            margin: 0 auto; padding: 20px 15px; max-width: 500px;
            padding-bottom: 120px; /* 預留空間給購物車按鈕 */
            overflow-x: hidden;
        }
        h1, h2, h3 { font-weight: normal; text-align: center; margin: 10px 0; }
        
        /* v13.0: 通用容器樣式 */
        .container-box {
            background: white;
            border-radius: 20px;
            outline: 3px dashed var(--line-color); outline-offset: -5px;
            border: 4px solid white;
            box-shadow: 5px 5px 15px var(--paper-shadow);
            padding: 20px; margin-bottom: 30px;
            transition: all 0.3s;
        }
        .hand-drawn-box { @extend .container-box; transform: rotate(-0.5deg); }
        
        /* --- v13.0 新增：大廳 (Lobby) 樣式 --- */
        #lobby-section { display: block; } /* 預設顯示大廳 */
        #ordering-section { display: none; } /* 預設隱藏點餐介面 */

        .lobby-title { text-align: center; font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; color: var(--line-color); }
        .restaurant-cards-container { display: flex; flex-direction: column; gap: 20px; }
        
        .restaurant-card {
            background: white; border: 3px solid var(--line-color); border-radius: 20px;
            padding: 20px; cursor: pointer; position: relative; overflow: hidden;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.1); transition: all 0.2s;
            transform: rotate(-0.5deg);
        }
        .restaurant-card:hover { transform: scale(1.02) rotate(0deg); box-shadow: 7px 7px 10px rgba(0,0,0,0.15); }
        .restaurant-card:active { transform: scale(0.98); box-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
        .restaurant-card h3 { margin: 0 0 10px 0; font-size: 1.4rem; text-align: left;}
        .restaurant-card-info { font-size: 0.95rem; color: #666; margin-bottom: 5px; display: flex; align-items: center;}
        .restaurant-card-badge { 
            position: absolute; top: 15px; right: 15px; 
            padding: 5px 12px; border-radius: 15px; font-weight: bold; font-size: 0.9rem;
            border: 2px solid var(--line-color); transform: rotate(2deg);
        }
        .badge-open { background: var(--success-green); color: white; }
        .badge-closed { background: var(--danger-red); color: white; }
        .no-sessions-msg { text-align: center; padding: 30px; font-size: 1.2rem; color: #888; font-style: italic; background: rgba(255,255,255,0.6); border-radius: 20px; border: 3px dashed #ccc;}
        
        /* 返回大廳按鈕 */
        .back-to-lobby-btn {
            display: inline-block; margin-bottom: 15px; padding: 8px 15px;
            background: var(--accent-blue); border: 2px solid var(--line-color);
            border-radius: 10px; font-weight: bold; cursor: pointer;
            box-shadow: 3px 3px 0 var(--line-color); font-family: inherit;
        }
        .back-to-lobby-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line-color); }


        /* --- 以下為原 v12.0 點餐介面樣式 --- */
        .status-section { background: var(--accent-green) !important; transform: rotate(-0.3deg); }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { 
            display: inline-block; padding: 8px 20px; margin-bottom: 10px;
            background: var(--accent-yellow); border-radius: 15px 25px 15px 25px;
            outline: 3px dashed var(--line-color); border: 3px solid white;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.1); transform: rotate(-1deg);
        }
        .restaurant-name { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; margin-top: 15px;}
        .menu-time-info { font-size: 0.85rem; color: #666; margin-bottom: 10px;}

        .map-link-btn {
            display: inline-block; text-decoration: none; color: white; font-weight: bold;
            background-color: var(--line-color);
            padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; margin-top: 5px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            transition: all 0.1s;
        }
        .map-link-btn:active { transform: translate(1px, 1px); box-shadow: none; }

        .deadline-banner {
            background-color: var(--accent-pink) !important; transform: rotate(0.5deg);
            text-align: center; padding: 15px; margin-bottom: 30px;
        }
        .deadline-title { font-size: 1.3rem; font-weight: bold; margin: 0 0 10px 0; }
        .deadline-full-date { font-size: 1rem; margin-bottom: 5px; }
        .countdown-timer { font-size: 1.5rem; font-weight: bold; color: var(--danger-red); background: white; padding: 5px 15px; border-radius: 10px; border: 2px solid var(--line-color); display: inline-block; margin-top: 5px;}
        .countdown-ended { color: var(--disabled-text); background: #eee; border-color: #aaa;}

        .price-note-up { color: var(--danger-red); font-size: 0.85rem; margin-left: 3px; font-weight: bold;}
        .price-note-down { color: var(--success-green); font-size: 0.85rem; margin-left: 3px; font-weight: bold;}

        body.order-closed .hand-drawn-box {
            opacity: 0.8; filter: grayscale(0.8); pointer-events: none;
            outline: 3px solid #aaa !important; border-radius: 10px !important; 
            transform: none !important; box-shadow: none !important;
        }

        .category-title {
            text-align: left; font-size: 1.1rem; font-weight: bold; 
            margin: 25px 0 15px 0; display: inline-block; padding: 8px 15px;
            background: var(--accent-yellow); 
            outline: 2px dashed var(--line-color); border: 3px solid white;
            border-radius: 10px 20px 10px 20px;
            box-shadow: 3px 3px 5px var(--paper-shadow); transform: rotate(-1deg);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            padding: 5px;
        }
        
        .menu-item-checkbox {
            background: white; overflow: visible;
            transition: all 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: 2px dashed var(--line-color); outline-offset: -2px;
            border: 3px solid white; border-radius: 15px;
            opacity: 0;
            transform: translateY(30px) scale(0.9); 
            box-shadow: none;
            display: flex; flex-direction: column;
        }

        .menu-item-checkbox.show {
            opacity: 1;
            transform: translateY(0) scale(1) rotate(-1deg) skewX(-1deg);
            box-shadow: 6px 6px 12px var(--sticker-shadow);
        }

        .menu-item-header { display: flex; align-items: center; padding: 10px; cursor: pointer; flex-grow: 1; }

        .food-icon-wrapper {
            width: 36px; height: 36px; font-size: 1.6rem; margin-right: 8px;
            background: #fff; outline: 2px dashed var(--line-color); border: 2px solid white;
            border-radius: 50% 45% 55% 50% / 50% 55% 45% 50%;
            transform: rotate(-3deg); flex-shrink: 0;
            box-shadow: 2px 2px 4px var(--paper-shadow);
        }

        .menu-item-checkbox.selected { 
            background: var(--accent-yellow); 
            outline: 3px solid var(--line-color);
            transform: scale(1.05) translateY(-8px) rotate(-2deg) skewX(-2deg) !important; 
            box-shadow: 10px 10px 20px var(--sticker-shadow-deep) !important;
            z-index: 5;
        }

        .menu-item-checkbox:active {
            transform: scale(0.98) rotate(-0.5deg) skewX(-0.5deg) !important;
            box-shadow: 3px 3px 6px var(--sticker-shadow) !important;
        }
        .checkbox-square, .item-details-container { display: none !important; }

        .food-info { flex-grow: 1; font-size: 1rem; display: flex; flex-wrap: wrap; align-items: center; line-height: 1.2;}
        .food-info b { margin-left: 5px; font-size: 1.1rem;}
        
        .note-input, input[type="text"] {
            width: 100%; padding: 8px; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; margin-bottom: 10px;
            background: white; outline: 2px dashed var(--line-color); border: 3px solid white;
            border-radius: 8px; box-shadow: 3px 3px 5px var(--paper-shadow);
        }
        .note-input:focus, input[type="text"]:focus { outline: 2px solid var(--line-color); }

        .user-input-section-in-cart { 
            padding: 20px; background: var(--accent-blue); border-radius: 15px;
            border: 2px dashed var(--line-color); margin-bottom: 15px;
            transform: rotate(0.5deg);
        }

        .avatar-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;}
        .avatar-option {
            width: 48px; height: 48px; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; cursor: pointer;
            background: white; position: relative;
            outline: 2px dashed var(--line-color); border: 3px solid white;
            border-radius: 50%; box-shadow: 3px 3px 6px var(--paper-shadow); transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .avatar-option.selected { 
            background: var(--accent-yellow); outline: 3px solid var(--line-color);
            box-shadow: 6px 6px 0 var(--line-color); transform: scale(1.15) translateY(-5px); z-index: 5;
        }

        .status-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed var(--line-color); padding-bottom: 10px; margin-bottom: 10px;}
        .status-item { padding: 10px 5px; border-bottom: 2px dashed rgba(74, 63, 53, 0.2); font-size: 0.95rem; }
        .status-user-row { display: flex; align-items: center; font-weight: bold; margin-bottom: 5px;}
        .status-avatar { font-size: 1.2rem; margin-right: 8px; }
        .status-items-detail { padding-left: 30px; font-size: 0.9rem; opacity: 0.9; }
        .item-note { background: white; padding: 1px 6px; border-radius: 10px; margin-left: 5px; font-size: 0.8rem; color: #555; border: 1px dashed #aaa; display: inline-block;}

        .cart-fab {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px; background: var(--accent-yellow);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100; box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
            border: 3px solid var(--line-color); transition: all 0.2s;
        }
        .cart-fab:active { transform: scale(0.95); box-shadow: 1px 1px 5px rgba(0,0,0,0.3); }
        .cart-icon { font-size: 1.8rem; }
        .cart-count-badge {
            position: absolute; top: -5px; right: -5px;
            background: var(--danger-red); color: white; font-size: 0.8rem; font-weight: bold;
            width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 2px solid white;
        }
        .cart-count-badge[data-count="0"] { display: none; }

        .cart-panel {
            position: fixed; top: 0; right: -100%;
            width: 90%; max-width: 450px; height: 100%; background: #FFFBE6;
            z-index: 102; transition: right 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; flex-direction: column; border-left: 3px dashed var(--line-color);
            box-shadow: -5px 0 15px rgba(0,0,0,0.2);
        }
        .cart-panel.open { right: 0; }
        .cart-header {
            padding: 15px 20px; background: var(--accent-yellow); display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px dashed var(--line-color); flex-shrink: 0;
        }
        .cart-header h3 { margin: 0; font-size: 1.3rem;}
        .close-cart-btn { background: none; border: none; font-size: 2rem; cursor: pointer; line-height: 1; color: var(--line-color); }
        
        .cart-content-container { flex-grow: 1; overflow-y: auto; position: relative; }
        .cart-step { 
            padding: 20px; 
            position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box;
            transition: all 0.3s ease-in-out; opacity: 1; transform: translateX(0);
        }
        .cart-step.hidden-left { opacity: 0; transform: translateX(-100%); pointer-events: none;}
        .cart-step.hidden-right { opacity: 0; transform: translateX(100%); pointer-events: none;}

        .empty-cart-msg { text-align: center; color: #888; font-style: italic; margin-top: 50px; }
        .cart-item {
            background: white; border: 2px solid var(--line-color); border-radius: 15px;
            padding: 15px; margin-bottom: 15px; position: relative; box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
        }
        .cart-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .cart-item-name { font-weight: bold; font-size: 1.1rem; }
        .cart-item-price { font-weight: bold; color: var(--danger-red); }
        .cart-item-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 10px;}
        .cart-qty-controls { display: flex; align-items: center; gap: 10px; }
        .cart-qty-btn {
            width: 28px; height: 28px; border-radius: 50%; background: white; border: 2px solid var(--line-color);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .cart-qty-btn:active { background: #eee; }
        .cart-item-remove { color: var(--danger-red); cursor: pointer; font-size: 0.9rem; text-decoration: underline;}
        .cart-item-note-input {
            width: 100%; padding: 8px; margin-top: 10px; border: 2px dashed var(--line-color); border-radius: 8px;
            font-family: inherit; font-size: 0.9rem; box-sizing: border-box;
        }
        
        .cart-footer { padding: 20px; background: white; border-top: 3px dashed var(--line-color); flex-shrink: 0; }
        .cart-total { font-size: 1.3rem; font-weight: bold; text-align: right; margin-bottom: 15px; }
        
        .cart-actions-group { display: flex; gap: 10px; }
        .cart-btn {
            flex: 1; padding: 12px; border: 3px solid var(--line-color);
            border-radius: 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            box-shadow: 3px 3px 0 var(--line-color); font-family: inherit;
            transition: all 0.1s;
        }
        .cart-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line-color); }
        .cart-btn-secondary { background: white; color: var(--line-color); }
        .cart-btn-primary { background: var(--accent-pink); color: var(--line-color); }
        .cart-btn-success { background: var(--success-green); color: white; border-color: darkgreen; box-shadow: 3px 3px 0 darkgreen;}
        .cart-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; filter: grayscale(1);}

        .cart-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            z-index: 101; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .cart-overlay.show { opacity: 1; pointer-events: auto; }
        body.order-closed .cart-fab { display: none; }

        .personal-welcome-section {
            display: none; /* 預設隱藏 */
            background: var(--accent-blue); border-radius: 20px;
            outline: 3px dashed var(--line-color); outline-offset: -5px;
            border: 4px solid white;
            box-shadow: 5px 5px 15px var(--paper-shadow);
            padding: 15px; margin-bottom: 20px;
            transform: rotate(0.5deg);
            text-align: center;
        }
        .welcome-text { font-size: 1.1rem; font-weight: bold; margin: 0 0 10px 0; }
        .last-order-info { font-size: 0.95rem; color: #555; background: rgba(255,255,255,0.6); padding: 10px; border-radius: 10px; border: 2px dashed var(--line-color);}
        .last-order-item { display: inline-block; margin: 2px 5px; font-weight: bold;}
    </style>
</head>
<body id="main-body">

    <header>
        <h1>✏️ 今天吃什麼？</h1>
        <button id="back-to-lobby-btn" class="back-to-lobby-btn" style="display: none;">🏠 返回大廳 (選擇其他餐廳)</button>
    </header>

    <section id="lobby-section">
        <h2 class="lobby-title">👇 今日開團餐廳 👇</h2>
        <div id="restaurant-cards-container" class="restaurant-cards-container">
            <p class="no-sessions-msg">目前沒有正在進行的團購...</p>
        </div>
    </section>

    <div id="ordering-section">
        <div id="restaurant-name-display" class="restaurant-name" style="text-align: center;"></div>
        <div id="restaurant-phone" style="font-size: 0.95rem; margin-bottom: 5px; text-align: center;"></div>
        <div id="map-link-container" style="text-align: center;"></div>
        <div id="menu-time-info" class="menu-time-info" style="margin-top: 10px; text-align: center;"></div>

        <section id="deadline-banner" class="hand-drawn-box deadline-banner">
            <h2 class="deadline-title">⏰ 點餐截止時間</h2>
            <div id="deadline-full-date" class="deadline-full-date">載入中...</div>
            <div id="countdown-timer" class="countdown-timer">計算中...</div>
        </section>

        <section id="personal-welcome-section" class="personal-welcome-section">
            <p id="welcome-text" class="welcome-text"></p>
            <div id="last-order-info" class="last-order-info">正在查詢您上次在這家餐廳的點餐紀錄...</div>
        </section>

        <main id="menu-section" class="hand-drawn-box menu-section">
            <h2>今日菜單 Menu</h2>
            <div id="menu-list-container">
                <p style="text-align: center;">正在載入菜單...</p>
            </div>
        </main>

        <section class="hand-drawn-box status-section">
            <div class="status-header">
                <h2>點餐狀況 (本場次)</h2>
                <span style="font-size: 0.9rem;">(<span id="total-people-count">0</span> 人已點)</span>
            </div>
            <ul id="live-status-list" class="status-list">
                <p style="text-align: center; opacity: 0.7;">目前還沒有人點餐...</p>
            </ul>
        </section>
    </div>

    <div id="cart-fab" class="cart-fab" style="display: none;">
        <span class="cart-icon">🛒</span>
        <span id="cart-count-badge" class="cart-count-badge" data-count="0">0</span>
    </div>

    <div id="cart-panel" class="cart-panel">
        <div class="cart-header">
            <h3 id="cart-title">我的餐點清單 (步驟 1/2)</h3>
            <button id="close-cart-btn" class="close-cart-btn">×</button>
        </div>
        
        <div class="cart-content-container">
            <div id="cart-step-1" class="cart-step">
                <div id="cart-items-list" class="cart-items-list">
                    <p class="empty-cart-msg">您還沒有選擇任何餐點喔！</p>
                </div>
            </div>
            
            <div id="cart-step-2" class="cart-step hidden-right">
                 <div class="user-input-section-in-cart">
                    <h3 style="margin-top: 0; text-align: center;">最後一步：填寫資料</h3>
                    <input type="text" id="username-input" placeholder="請輸入你的名字 (例如：小陳)">
                    
                    <p style="text-align: center; margin: 15px 0 10px 0; font-weight: bold; font-size: 1.1rem;">選擇一個頭像貼紙：</p>
                    <div class="avatar-selector" id="avatar-selector">
                        <div class="avatar-option" onclick="selectAvatar(this, '🐻')">🐻</div>
                        <div class="avatar-option" onclick="selectAvatar(this, '🐰')">🐰</div>
                        <div class="avatar-option" onclick="selectAvatar(this, '🐱')">🐱</div>
                        <div class="avatar-option" onclick="selectAvatar(this, '🐶')">🐶</div>
                        <div class="avatar-option" onclick="selectAvatar(this, '🦊')">🦊</div>
                        <div class="avatar-option" onclick="selectAvatar(this, '🐷')">🐷</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                總計：$<span id="cart-total-price">0</span>
            </div>
            
            <div id="cart-btns-step-1" class="cart-actions-group">
                <button id="btn-continue-shopping" class="cart-btn cart-btn-secondary">繼續點餐</button>
                <button id="btn-to-checkout" class="cart-btn cart-btn-primary" disabled>前往結帳 👉</button>
            </div>
            
            <div id="cart-btns-step-2" class="cart-actions-group" style="display: none;">
                <button id="btn-back-to-cart" class="cart-btn cart-btn-secondary">👈 回上一步</button>
                <button id="btn-submit-order" class="cart-btn cart-btn-success" disabled>確認送出訂單 ✅</button>
            </div>
        </div>
    </div>
    <div id="cart-overlay" class="cart-overlay"></div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection, addDoc, query, orderBy, serverTimestamp, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDCDl7YuEixL8T_0Iemjq9soqqgg_fP0yI",
          authDomain: "cute-lunch-order.firebaseapp.com",
          projectId: "cute-lunch-order",
          storageBucket: "cute-lunch-order.firebasestorage.app",
          messagingSenderId: "62115069448",
          appId: "1:62115069448:web:212231a6452f87a3d69bbd",
          measurementId: "G-DWMWFSHQPX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM - 大廳相關
        const lobbySection = document.getElementById('lobby-section');
        const orderingSection = document.getElementById('ordering-section');
        const restaurantCardsContainer = document.getElementById('restaurant-cards-container');
        const backToLobbyBtn = document.getElementById('back-to-lobby-btn');

        // DOM - 點餐介面相關
        const mainBody = document.getElementById('main-body');
        const menuContainer = document.getElementById('menu-list-container');
        const restaurantNameDisplay = document.getElementById('restaurant-name-display');
        const menuTimeInfoDisplay = document.getElementById('menu-time-info');
        const restaurantPhoneDisplay = document.getElementById('restaurant-phone');
        const usernameInput = document.getElementById('username-input');
        const liveStatusList = document.getElementById('live-status-list');
        const totalPeopleCountSpan = document.getElementById('total-people-count');
        const mapLinkContainer = document.getElementById('map-link-container');
        const deadlineBanner = document.getElementById('deadline-banner');
        const deadlineFullDateDisplay = document.getElementById('deadline-full-date');
        const countdownTimerDisplay = document.getElementById('countdown-timer');

        const personalWelcomeSection = document.getElementById('personal-welcome-section');
        const welcomeText = document.getElementById('welcome-text');
        const lastOrderInfo = document.getElementById('last-order-info');

        // 購物車相關 DOM
        const cartFab = document.getElementById('cart-fab');
        const cartCountBadge = document.getElementById('cart-count-badge');
        const cartPanel = document.getElementById('cart-panel');
        const cartTitle = document.getElementById('cart-title');
        const closeCartBtn = document.getElementById('close-cart-btn');
        const cartItemsList = document.getElementById('cart-items-list');
        const cartTotalPriceSpan = document.getElementById('cart-total-price');
        const cartOverlay = document.getElementById('cart-overlay');
        
        const cartStep1 = document.getElementById('cart-step-1');
        const cartStep2 = document.getElementById('cart-step-2');
        const cartBtnsStep1 = document.getElementById('cart-btns-step-1');
        const cartBtnsStep2 = document.getElementById('cart-btns-step-2');
        const btnContinueShopping = document.getElementById('btn-continue-shopping');
        const btnToCheckout = document.getElementById('btn-to-checkout');
        const btnBackToCart = document.getElementById('btn-back-to-cart');
        const btnSubmitOrder = document.getElementById('btn-submit-order');

        // 應用程式狀態
        let appState = 'lobby'; // 'lobby' or 'ordering'

        // 點餐資料變數 (每次進入餐廳時會重置)
        let selectedAvatarChar = null;
        let cartItems = []; 
        let currentSessionId = null; // 重要：當前選中的場次 ID
        let currentRestaurantName = null;
        let unsubscribeOrders = null;
        let isManualClosed = false;
        let deadlineDate = null;
        let countdownInterval = null;
        let priceChangeMap = new Map(); 
        let globalItemIndex = 0;
        let currentCartStep = 1;

        // --- v13.0 A. 大廳邏輯：監聽活躍場次 ---
        // 監聽 activeSessions 集合，依建立時間倒序排列
        const qActiveSessions = query(collection(db, "activeSessions"), orderBy("createdAt", "desc"));
        onSnapshot(qActiveSessions, (snapshot) => {
            if (appState === 'ordering') return; // 如果正在點餐，不更新大廳，避免干擾

            restaurantCardsContainer.innerHTML = '';
            if (snapshot.empty) {
                restaurantCardsContainer.innerHTML = '<p class="no-sessions-msg">目前沒有正在進行的團購...</p>';
                return;
            }

            snapshot.forEach(doc => {
                const data = doc.data();
                createRestaurantCard(doc.id, data);
            });
        });

        // 建立餐廳卡片
        function createRestaurantCard(docId, data) {
            const card = document.createElement('div');
            card.classList.add('restaurant-card');

            // 計算截止狀態
            let deadlineStatusHtml = '';
            let isClosed = data.isOrderClosed;
            if (data.deadlineTimestamp) {
                const deadline = data.deadlineTimestamp.toDate();
                const now = new Date();
                const timeStr = deadline.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if (now >= deadline) {
                    isClosed = true;
                    deadlineStatusHtml = `<span style="color: var(--danger-red);">⏰ 已於 ${timeStr} 截止</span>`;
                } else {
                    deadlineStatusHtml = `<span>⏰ 今日 ${timeStr} 截止</span>`;
                }
            } else {
                deadlineStatusHtml = `<span>⏰ 未設定截止時間</span>`;
            }

            const badgeClass = isClosed ? 'badge-closed' : 'badge-open';
            const badgeText = isClosed ? '已截止' : '開放中';

            card.innerHTML = `
                <span class="restaurant-card-badge ${badgeClass}">${badgeText}</span>
                <h3>🍽️ ${data.restaurantName}</h3>
                <div class="restaurant-card-info">📞 ${data.restaurantPhone || '(無電話)'}</div>
                <div class="restaurant-card-info">${deadlineStatusHtml}</div>
            `;

            // 點擊卡片進入點餐介面
            card.addEventListener('click', () => {
                switchToOrderingState(docId, data);
            });

            restaurantCardsContainer.appendChild(card);
        }

        // --- v13.0 B. 切換到點餐狀態 (載入單一場次資料) ---
        function switchToOrderingState(docId, data) {
            appState = 'ordering';
            lobbySection.style.display = 'none';
            orderingSection.style.display = 'block';
            backToLobbyBtn.style.display = 'inline-block';
            cartFab.style.display = 'flex'; // 顯示購物車按鈕

            // 重置並載入該場次的資料
            reset orderingSessionData();
            currentSessionId = data.sessionId;
            currentRestaurantName = data.restaurantName;

            // 更新介面顯示
            restaurantNameDisplay.textContent = data.restaurantName;
            restaurantPhoneDisplay.textContent = data.restaurantPhone ? `📞 電話: ${data.restaurantPhone}` : '';
            
            if (data.restaurantMapUrl) {
                mapLinkContainer.innerHTML = `<a href="${data.restaurantMapUrl}" target="_blank" class="map-link-btn">🗺️ 去 Google Maps 看照片</a>`;
            } else {
                mapLinkContainer.innerHTML = '';
            }

            let timeInfoHtml = '';
            if (data.createdAt) {
                const createTime = new Date(data.createdAt.seconds * 1000).toLocaleString('zh-TW', {hour: '2-digit', minute:'2-digit'});
                timeInfoHtml += `開團時間: ${createTime}`;
            }
            menuTimeInfoDisplay.innerHTML = timeInfoHtml;

            if (data.deadlineTimestamp) {
                deadlineDate = data.deadlineTimestamp.toDate();
                deadlineFullDateDisplay.textContent = deadlineDate.toLocaleString('zh-TW', {year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false});
                deadlineBanner.style.display = 'block';
            } else {
                deadlineDate = null;
                deadlineFullDateDisplay.textContent = '(未設定)';
                deadlineBanner.style.display = 'none';
            }

            isManualClosed = data.isOrderClosed === true;
            startCountdown();
            updateFormState(isManualClosed);
            
            // 不再需要 processPriceChanges，因為是全新場次
            renderMenu(data);
            
            if (currentSessionId) {
                setupOrderListener(currentSessionId);
            }
            
            updateCartUI();

            // 嘗試讀取使用者記憶
            const userPrefs = loadUserPreferences();
            if (userPrefs && userPrefs.name && userPrefs.avatar) {
                usernameInput.value = userPrefs.name;
                const avatarEl = Array.from(document.querySelectorAll('.avatar-option')).find(el => el.textContent === userPrefs.avatar);
                if (avatarEl) {
                    selectAvatar(avatarEl, userPrefs.avatar);
                }
                checkAndDisplayLastOrder(userPrefs.name, currentRestaurantName);
            } else {
                personalWelcomeSection.style.display = 'none';
            }
        }

        // --- v13.0 C. 切換回大廳狀態 ---
        backToLobbyBtn.addEventListener('click', () => {
            switchToLobbyState();
        });

        function switchToLobbyState() {
            appState = 'lobby';
            lobbySection.style.display = 'block';
            orderingSection.style.display = 'none';
            backToLobbyBtn.style.display = 'none';
            cartFab.style.display = 'none'; // 隱藏購物車按鈕
            closeCart(); // 確保購物車關閉
            resetOrderingSessionData(); // 清空點餐資料
        }

        // 重置點餐相關資料
        function resetOrderingSessionData() {
            currentSessionId = null;
            currentRestaurantName = null;
            selectedAvatarChar = null;
            cartItems = [];
            priceChangeMap.clear();
            globalItemIndex = 0;
            currentCartStep = 1;
            isManualClosed = false;
            deadlineDate = null;
            if (countdownInterval) clearInterval(countdownInterval);
            if (unsubscribeOrders) unsubscribeOrders();
            
            menuContainer.innerHTML = '<p style="text-align: center;">正在載入菜單...</p>';
            liveStatusList.innerHTML = '<p style="text-align: center;">讀取中...</p>';
            totalPeopleCountSpan.textContent = '0';
            personalWelcomeSection.style.display = 'none';
            usernameInput.value = '';
            document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
            updateCartUI();
        }


        // --- 使用者偏好設定函數 (LocalStorage) ---
        const STORAGE_KEY_USER = 'lunchOrderUserPrefs';

        function saveUserPreferences(name, avatar) {
            const prefs = { name: name, avatar: avatar, lastUpdated: new Date().getTime() };
            localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(prefs));
        }

        function loadUserPreferences() {
            const prefsJSON = localStorage.getItem(STORAGE_KEY_USER);
            if (prefsJSON) {
                try {
                    return JSON.parse(prefsJSON);
                } catch (e) {
                    console.error('Error parsing user prefs:', e);
                    return null;
                }
            }
            return null;
        }

        // --- 查詢並顯示上次訂單紀錄 ---
        async function checkAndDisplayLastOrder(userName, restaurantName) {
            if (!userName || !restaurantName) return;

            welcomeText.innerHTML = `${selectedAvatarChar} 嗨，<b>${userName}</b>！歡迎回來。`;
            personalWelcomeSection.style.display = 'block';
            lastOrderInfo.innerHTML = '正在查詢您上次在這家餐廳的點餐紀錄...';

            const q = query(
                collection(db, "todayOrders"),
                where("userName", "==", userName),
                orderBy("orderTime", "desc"),
                limit(1)
            );

            try {
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    const lastOrder = querySnapshot.docs[0].data();
                    let itemsHtml = lastOrder.items.map(item => {
                        const qtyHtml = item.quantity > 1 ? ` x${item.quantity}` : '';
                        const noteHtml = item.note ? ` (${item.note})` : '';
                        return `<span class="last-order-item">${item.name}${qtyHtml}${noteHtml}</span>`;
                    }).join('、');
                    
                    const orderDate = lastOrder.orderTime ? new Date(lastOrder.orderTime.seconds * 1000).toLocaleDateString('zh-TW') : '之前的某天';

                    lastOrderInfo.innerHTML = `您上次 (${orderDate}) 點了：<br>${itemsHtml}`;

                } else {
                    lastOrderInfo.innerHTML = '您以前好像還沒點過這家餐廳喔！試試看什麼好吃的吧？';
                }
            } catch (error) {
                console.error("Error fetching last order:", error);
                lastOrderInfo.innerHTML = '抱歉，查詢歷史紀錄時發生錯誤。';
            }
        }

        // 倒數計時功能 (只負責顯示)
        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            if (!deadlineDate) { countdownTimerDisplay.textContent = '---'; return; }
            const updateTimer = () => {
                const now = new Date();
                const diff = deadlineDate - now;
                if (diff <= 0) {
                    countdownTimerDisplay.textContent = '⛔ 已截止';
                    countdownTimerDisplay.classList.add('countdown-ended');
                    clearInterval(countdownInterval);
                } else {
                    const hours = Math.floor(diff / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    countdownTimerDisplay.textContent = `剩餘 ${hours.toString().padStart(2, '0')}小時 ${minutes.toString().padStart(2, '0')}分 ${seconds.toString().padStart(2, '0')}秒`;
                    countdownTimerDisplay.classList.remove('countdown-ended');
                }
            };
            updateTimer();
            countdownInterval = setInterval(updateTimer, 1000);
        }

        function updateFormState(isLocked) {
            if (isLocked) {
                mainBody.classList.add('order-closed');
                closeCart(); 
            } else {
                mainBody.classList.remove('order-closed');
            }
            checkSubmitButtonState();
        }

        function getIconForDish(dishName) {
            const keywordMap = [
                { keywords: ['雞', 'G', '腿', '排', '翅'], icon: '🍗' },
                { keywords: ['牛', '牛排', '牛肉'], icon: '🥩' },
                { keywords: ['豬', '排骨', '肉絲', '培根', '叉燒', '控肉', '魯肉', '香腸', '肉'], icon: '🐷' },
                { keywords: ['魚', '鰻', '鯖', '鮭', '海鮮'], icon: '🐟' },
                { keywords: ['蝦', '蝦仁', '炸蝦', '捲'], icon: '🍤' },
                { keywords: ['麵', '米粉', '冬粉', '拉麵', '烏龍', '意麵'], icon: '🍜' },
                { keywords: ['飯', '丼', '便當', '粥', '米糕'], icon: '🍚' },
                { keywords: ['堡', '三明治', '吐司', '熱狗'], icon: '🥪' },
                { keywords: ['餃', '鍋貼', '小籠包', '餛飩', '包'], icon: '🥟' },
                { keywords: ['湯', '羹'], icon: '🥣' },
                { keywords: ['菜', '素', '沙拉', '豆', '茄'], icon: '🥬' },
                { keywords: ['炸', '薯條', '雞塊', '這'], icon: '🍟' },
                { keywords: ['咖哩'], icon: '🍛' },
                { keywords: ['蛋', '歐姆'], icon: '🍳' },
                { keywords: ['茶', '咖啡', '飲', '奶', '果汁', '紅茶', '綠茶'], icon: '🥤' },
                { keywords: ['甜', '蛋糕', '點心'], icon: '🍰' },
            ];
            for (const entry of keywordMap) {
                if (entry.keywords.some(keyword => dishName.includes(keyword))) return entry.icon;
            }
            return '🍽️';
        }

        // renderMenu (維持不變)
        function renderMenu(data) {
            menuContainer.innerHTML = '';
            globalItemIndex = 0;
            if (data.menuCategories && Array.isArray(data.menuCategories)) {
                data.menuCategories.forEach(category => {
                    const titleEl = document.createElement('div');
                    titleEl.classList.add('category-title');
                    titleEl.textContent = category.categoryName;
                    menuContainer.appendChild(titleEl);
                    const listEl = document.createElement('div');
                    listEl.classList.add('menu-grid');
                    category.items.forEach(item => { listEl.appendChild(createMenuItemElement(item)); });
                    menuContainer.appendChild(listEl);
                });
            } else if (data.menuItems && Array.isArray(data.menuItems)) {
                const listEl = document.createElement('div');
                listEl.classList.add('menu-grid');
                data.menuItems.forEach(item => { listEl.appendChild(createMenuItemElement(item)); });
                menuContainer.appendChild(listEl);
            } else { menuContainer.innerHTML = '<p>菜單資料格式錯誤或為空。</p>'; }
            setupScrollAnimations();
        }

        function setupScrollAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('show');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.menu-item-checkbox').forEach(item => observer.observe(item));
        }

        // --- v11.0 核心：購物車邏輯 ---

        // 1. 建立菜單項目 (點擊加入購物車)
        function createMenuItemElement(item) {
            const el = document.createElement('div');
            el.classList.add('menu-item-checkbox');
            el.style.transitionDelay = `${globalItemIndex * 0.025}s`;
            globalItemIndex++;

            const dishIcon = getIconForDish(item.name);

            el.innerHTML = `
                <div class="menu-item-header">
                    <div class="food-icon-wrapper">${dishIcon}</div>
                    <div class="food-info">
                        <span>${item.name}</span>
                        <div><b>$${item.price}</b></div>
                    </div>
                </div>
            `;
            
            el.addEventListener('click', () => {
                if (mainBody.classList.contains('order-closed')) return;
                addToCart(item, dishIcon);
                openCart(1); 
            });
            return el;
        }

        // 2. 加入購物車
        function addToCart(item, icon) {
            const existingItem = cartItems.find(i => i.name === item.name);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cartItems.push({
                    name: item.name,
                    price: item.price,
                    quantity: 1,
                    note: '',
                    icon: icon
                });
            }
            updateCartUI();
            updateMenuSelectionState(); 
        }

        // 3. 更新購物車介面 (Badge, Total, List)
        function updateCartUI() {
            const totalCount = cartItems.reduce((sum, item) => sum + item.quantity, 0);
            cartCountBadge.textContent = totalCount;
            cartCountBadge.setAttribute('data-count', totalCount);

            const totalPrice = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotalPriceSpan.textContent = totalPrice;

            cartItemsList.innerHTML = '';
            if (cartItems.length === 0) {
                cartItemsList.innerHTML = '<p class="empty-cart-msg">您還沒有選擇任何餐點喔！</p>';
            } else {
                cartItems.forEach((item, index) => {
                    const itemEl = document.createElement('div');
                    itemEl.classList.add('cart-item');
                    itemEl.innerHTML = `
                        <div class="cart-item-header">
                            <div><span style="font-size:1.2rem">${item.icon}</span> <span class="cart-item-name">${item.name}</span></div>
                            <div class="cart-item-price">$${item.price * item.quantity}</div>
                        </div>
                        <div class="cart-item-controls">
                            <div class="cart-qty-controls">
                                <button class="cart-qty-btn minus">-</button>
                                <span>${item.quantity}</span>
                                <button class="cart-qty-btn plus">+</button>
                            </div>
                            <span class="cart-item-remove">刪除</span>
                        </div>
                        <input type="text" class="cart-item-note-input" placeholder="備註 (例如: 加辣)" value="${item.note}">
                    `;

                    itemEl.querySelector('.minus').addEventListener('click', () => updateCartItemQuantity(index, -1));
                    itemEl.querySelector('.plus').addEventListener('click', () => updateCartItemQuantity(index, 1));
                    itemEl.querySelector('.cart-item-remove').addEventListener('click', () => removeFromCart(index));
                    itemEl.querySelector('.cart-item-note-input').addEventListener('input', (e) => { item.note = e.target.value.trim(); });
                    
                    cartItemsList.appendChild(itemEl);
                });
            }
            checkSubmitButtonState();
        }

        // 4. 更新購物車商品數量
        function updateCartItemQuantity(index, delta) {
            const item = cartItems[index];
            item.quantity += delta;
            if (item.quantity <= 0) {
                removeFromCart(index);
            } else {
                updateCartUI();
            }
        }

        // 5. 從購物車移除
        function removeFromCart(index) {
            cartItems.splice(index, 1);
            updateCartUI();
            updateMenuSelectionState();
            if (cartItems.length === 0 && currentCartStep === 2) {
                switchToCartStep(1);
            }
        }

        // 6. 更新菜單卡片的選中狀態 (視覺回饋)
        function updateMenuSelectionState() {
            const menuCards = document.querySelectorAll('.menu-item-checkbox');
            menuCards.forEach(card => {
                const itemName = card.querySelector('.food-info span').textContent;
                const isInCart = cartItems.some(item => item.name === itemName);
                if (isInCart) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });
        }

        // --- v11.3 購物車面板與步驟控制 ---
        function openCart(step = 1) {
            cartPanel.classList.add('open');
            cartOverlay.classList.add('show');
            document.body.style.overflow = 'hidden';
            switchToCartStep(step);
        }
        function closeCart() {
            cartPanel.classList.remove('open');
            cartOverlay.classList.remove('show');
            document.body.style.overflow = '';
            setTimeout(() => { switchToCartStep(1); }, 300);
        }

        function switchToCartStep(step) {
            currentCartStep = step;
            cartTitle.textContent = `我的餐點清單 (步驟 ${step}/2)`;

            if (step === 1) {
                cartStep1.classList.remove('hidden-left');
                cartStep2.classList.add('hidden-right');
                cartBtnsStep1.style.display = 'flex';
                cartBtnsStep2.style.display = 'none';
            } else if (step === 2) {
                cartStep1.classList.add('hidden-left');
                cartStep2.classList.remove('hidden-right');
                cartBtnsStep1.style.display = 'none';
                cartBtnsStep2.style.display = 'flex';
                setTimeout(() => usernameInput.focus(), 100);
            }
            checkSubmitButtonState();
        }

        cartFab.addEventListener('click', () => openCart(1));
        closeCartBtn.addEventListener('click', closeCart);
        cartOverlay.addEventListener('click', closeCart);
        btnContinueShopping.addEventListener('click', closeCart);
        btnToCheckout.addEventListener('click', () => switchToCartStep(2));
        btnBackToCart.addEventListener('click', () => switchToCartStep(1));


        // --- B. 用戶輸入互動 ---
        window.selectAvatar = (element, char) => {
            if (mainBody.classList.contains('order-closed')) return;
            document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
            element.classList.add('selected');
            selectedAvatarChar = char;
            checkSubmitButtonState();
        }

        function checkSubmitButtonState() {
            const isClosed = mainBody.classList.contains('order-closed');
            const isCartEmpty = cartItems.length === 0;
            const isUserReady = selectedAvatarChar && usernameInput.value.trim() !== '';
            
            btnToCheckout.disabled = isClosed || isCartEmpty;
            btnSubmitOrder.disabled = isClosed || isCartEmpty || !isUserReady;

            if (isClosed) {
                 btnSubmitOrder.textContent = '⛔ 已結單';
                 btnToCheckout.textContent = '⛔ 已結單';
            } else {
                 btnSubmitOrder.textContent = '確認送出訂單 ✅';
                 btnToCheckout.textContent = '前往結帳 👉';
            }
        }
        usernameInput.addEventListener('input', checkSubmitButtonState);

        // --- C. 送出訂單 ---
        btnSubmitOrder.addEventListener('click', async () => {
            if (btnSubmitOrder.disabled || mainBody.classList.contains('order-closed')) return;
            // v13.0: 確保有選中場次
            if (!currentSessionId) { alert('系統錯誤：無場次 ID，請嘗試重新整理頁面。'); return; }
            
            const userName = usernameInput.value.trim();
            btnSubmitOrder.textContent = '正在送出...';
            btnSubmitOrder.disabled = true;

            const itemsToOrder = cartItems.map(item => ({
                name: item.name,
                price: item.price,
                note: item.note,
                quantity: item.quantity
            }));
            const totalCost = parseInt(cartTotalPriceSpan.textContent);

            try {
                // v13.0: 訂單資料結構不變，依然包含 sessionId
                await addDoc(collection(db, "todayOrders"), {
                    sessionId: currentSessionId,
                    userName: userName,
                    userAvatar: selectedAvatarChar,
                    items: itemsToOrder,
                    totalCost: totalCost,
                    paidAmount: 0,
                    orderTime: serverTimestamp()
                });

                saveUserPreferences(userName, selectedAvatarChar);

                alert(`✅ ${userName}，訂單送出成功！`);
                
                cartItems = [];
                updateCartUI();
                updateMenuSelectionState();
                closeCart();
                checkSubmitButtonState();
                
                checkAndDisplayLastOrder(userName, currentRestaurantName);

            } catch (e) {
                alert('❌ 訂購失敗：' + e.message);
                checkSubmitButtonState();
            }
        });

        // --- D. 即時監聽點餐狀況 (維持 v9.1) ---
        function setupOrderListener(sessionId) {
            if (unsubscribeOrders) unsubscribeOrders();
            const q = query(collection(db, "todayOrders"), where("sessionId", "==", sessionId), orderBy("orderTime", "desc"));
            unsubscribeOrders = onSnapshot(q, (querySnapshot) => {
                liveStatusList.innerHTML = '';
                totalPeopleCountSpan.textContent = querySnapshot.size;
                if (querySnapshot.empty) { liveStatusList.innerHTML = '<p style="text-align: center; opacity: 0.7;">目前還沒有人點餐...</p>'; return; }
                querySnapshot.forEach((doc) => {
                    const order = doc.data();
                    const li = document.createElement('li');
                    li.classList.add('status-item');
                    let itemsHtml = order.items.map(item => {
                        const noteHtml = item.note ? `<span class="item-note">${item.note}</span>` : '';
                        const qtyHtml = item.quantity > 1 ? ` <b>x${item.quantity}</b>` : '';
                        return `<div>- ${item.name}${qtyHtml} ${noteHtml}</div>`;
                    }).join('');
                    li.innerHTML = `
                        <div class="status-user-row">
                            <span class="status-avatar">${order.userAvatar}</span>
                            <span>${order.userName} (總計: $${order.totalCost})</span>
                        </div>
                        <div class="status-items-detail">${itemsHtml}</div>
                    `;
                    liveStatusList.appendChild(li);
                });
            });
        }
    </script>
</body>
