<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 管理後台 (v13.0 多場次架構)</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- 基礎樣式 (維持 v11.4) --- */
        :root { --bg-color: #FFFBE6; --line-color: #4A3F35; --accent-yellow: #FFEF9F; --accent-pink: #FFC4C4; --accent-blue: #C4E4FF; --danger-red: #d9534f; --success-green: #c7edb6; --warning-orange: #ffeeba; --paper-shadow: rgba(0, 0, 0, 0.15); }
        body {
            font-family: 'Patrick Hand', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--line-color) 0.5px, transparent 0.5px);
            background-size: 20px 20px; color: var(--line-color);
            padding: 20px; margin: auto;
        }
        h1, h2 { text-align: center; margin-top: 0; }
        header { text-align: center; margin-bottom: 20px; }
        
        /* v13.0 新增：場次選擇器樣式 */
        .session-selector-container {
            margin: 15px auto; text-align: center;
            padding: 10px; background: white; border: 2px dashed var(--line-color);
            border-radius: 15px; display: inline-block;
        }
        #session-selector {
            padding: 8px; font-size: 1rem; border: 2px solid var(--line-color);
            border-radius: 5px; font-family: inherit; max-width: 300px;
        }

        .session-info { font-size: 0.9rem; color: #666; margin-top: 5px;}
        
        .admin-box {
            background: white;
            border-radius: 20px;
            outline: 3px dashed var(--line-color); outline-offset: -5px;
            border: 4px solid white;
            box-shadow: 5px 5px 15px var(--paper-shadow);
            padding: 20px; margin-bottom: 30px;
            height: fit-content;
        }
        
        /* --- CSS Grid 布局 (維持 v11.4) --- */
        .admin-main-grid { display: grid; grid-template-columns: 1fr; gap: 25px; max-width: 1200px; margin: 0 auto; }
        @media (min-width: 900px) {
            .admin-main-grid { grid-template-columns: 1fr 1fr; align-items: start; }
            .history-box, .publish-box { grid-column: 1 / -1; }
            .summary-box, .details-box { align-self: stretch; }
        }

        .order-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem;}
        .order-table th, .order-table td { border: 2px solid var(--line-color); padding: 8px; text-align: center; vertical-align: middle; background: white;}
        .order-table th { background: var(--accent-yellow); }
        .text-left { text-align: left !important; }
        .item-note { background: #eee; padding: 1px 4px; border-radius: 4px; font-size: 0.8rem; color: #666; }
        .paid-input { width: 70px; padding: 5px; border: 2px solid #ccc; border-radius: 5px; text-align: center; font-weight: bold; font-family: inherit;}
        .status-paid { color: green; font-weight: bold; }
        .status-debt { color: red; font-weight: bold; background: #ffe6e6;}
        .status-change { color: blue; font-weight: bold; background: #e6f0ff;}
        .row-fully-paid td { background-color: #e6ffe6 !important; opacity: 0.8; }

        .btn { background: var(--accent-yellow); border: 2px solid var(--line-color); padding: 8px 15px; cursor: pointer; font-weight: bold; box-shadow: 2px 2px 0 var(--line-color); border-radius: 5px; font-family: inherit;}
        .btn:active { transform: translate(1px, 1px); box-shadow: none; }
        .btn-new-session { background: var(--accent-pink); font-size: 1.1rem; padding: 10px 20px; width: 100%; border-radius: 10px;}
        .btn-load { background: var(--accent-blue); font-size: 0.9rem; padding: 5px 10px;}
        .btn-delete { background: var(--danger-red); color: white; font-size: 0.9rem; padding: 5px 10px; border: none; box-shadow: 2px 2px 0 #a52a2a;}
        .btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-delete-session { background: var(--danger-red); color: white; margin-left: 10px;}

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 20px; max-width: 1200px; margin-left: auto; margin-right: auto;}
        
        .close-order-section { 
            flex-grow: 1; padding: 15px 25px; 
            background: white; border: 3px dashed var(--line-color); 
            border-radius: 20px; text-align: center; transform: rotate(0.5deg);
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
        }

        /* 滑動開關 CSS (v11.2) */
        .switch-container { position: relative; display: inline-block; width: 120px; height: 44px; margin-left: 20px; }
        .switch-input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--danger-red); transition: .4s; border: 3px solid var(--line-color); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-weight: bold; color: white; font-size: 1.1rem; }
        .slider.round { border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 32px; width: 32px; left: 4px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; border: 2px solid var(--line-color); box-shadow: 2px 2px 5px rgba(0,0,0,0.2); z-index: 2; }
        .switch-input:checked + .slider { background-color: var(--success-green); }
        .switch-input:checked + .slider:before { transform: translateX(74px); }
        .switch-label-on { opacity: 0; transition: .4s; color: darkgreen; margin-left: 5px; text-shadow: 1px 1px 0 #fff;}
        .switch-label-off { opacity: 1; transition: .4s; color: white; margin-right: 35px; text-shadow: 1px 1px 0 var(--line-color);}
        .switch-input:checked + .slider .switch-label-on { opacity: 1; }
        .switch-input:checked + .slider .switch-label-off { opacity: 0; }

        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; margin-left: 10px;}
        .status-open { background: var(--success-green); color: darkgreen; border: 2px solid darkgreen;}
        .status-closed { background: var(--danger-red); color: white; border: 2px solid darkred;}

        .summary-header-info { font-weight: bold; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px dashed rgba(0,0,0,0.2);}
        .summary-list { list-style: disc; padding-left: 20px; margin: 0;}
        .summary-list li { margin-bottom: 8px; font-size: 1rem; }
        
        .history-container-wrapper { max-height: 300px; overflow-y: auto; padding-right: 5px;}
        .history-list { list-style: none; padding: 0; margin: 0;}
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 2px dashed #ddd; background: white;}
        
        textarea, input[type="text"], input[type="time"] { 
            width: 100%; border: 2px solid var(--line-color); padding: 8px; font-family: inherit; box-sizing: border-box;
            background: white; border-radius: 5px; font-size: 1rem; margin-bottom: 10px;
        }
        textarea { height: 150px; font-family: monospace; }
        .time-input-container { 
            margin: 15px 0; padding: 15px; background: var(--accent-blue); border-radius: 10px; border: 2px dashed var(--line-color);
            text-align: center; display: flex; align-items: center; justify-content: center; transform: rotate(-0.5deg);
        }
        input[type="time"] { width: auto; font-size: 1.2rem; padding: 5px 10px; margin-left: 10px;}
    </style>
</head>
<body>
    <header>
        <h1>🔧 管理後台 (v13.0 多場次架構)</h1>
        
        <div class="session-selector-container">
            <label for="session-selector" style="font-weight: bold;">選擇要管理的餐廳場次：</label>
            <br>
            <select id="session-selector">
                <option value="">(讀取中...)</option>
            </select>
             <button id="btn-delete-session" class="btn btn-delete-session" style="display: none;">🗑️ 刪除此場次</button>
        </div>

        <div id="admin-restaurant-name" style="font-size: 1.5rem; font-weight: bold; display: inline-block; background: var(--accent-yellow); padding: 5px 15px; border-radius: 10px; border: 2px solid var(--line-color); transform: rotate(-1deg); margin-top: 10px;">(請先選擇場次)</div>
        <div class="session-info">
            <span id="current-session-id"></span>
            <span id="status-badge" class="status-badge" style="display: none;"></span>
        </div>
        <div id="deadline-display" style="font-size: 1rem; color: var(--danger-red); font-weight: bold; margin-top: 10px; background: white; padding: 5px 10px; border-radius: 10px; border: 2px dashed var(--danger-red); display: inline-block; transform: rotate(1deg); display: none;"></div>
    </header>

    <div class="header-actions">
        <div class="close-order-section">
            <div style="text-align: left;">
                <p style="margin: 5px 0; font-weight: bold; font-size: 1.2rem;">手動點餐開關</p>
                <p id="close-order-hint" style="font-size: 0.9rem; margin: 5px 0 0 0; color: #666;">(請先選擇場次)</p>
            </div>
             <label class="switch-container">
                <input type="checkbox" id="toggle-order-status" class="switch-input" disabled>
                <span class="slider round">
                    <span class="switch-label-on">開啟</span>
                    <span class="switch-label-off">關閉</span>
                </span>
            </label>
        </div>
        <div>
            <a href="index.html" target="_blank" class="btn" style="text-decoration: none; background: var(--accent-blue); display: inline-block;">➡️ 前往點餐頁面</a>
        </div>
    </div>

    <div class="admin-main-grid">
        
        <section class="admin-box summary-box" style="background: var(--accent-pink);">
            <h2>☎️ 訂單統整 (打電話用)</h2>
            <div id="summary-header" class="summary-header-info">請先選擇場次...</div>
            <div class="summary-container-wrapper">
                <ul id="aggregated-order-list" class="summary-list">
                    <li>---</li>
                </ul>
            </div>
        </section>

        <section class="admin-box details-box">
            <h2>💰 訂單明細與管理</h2>
            <div style="overflow-x: auto;">
                <table class="order-table">
                    <thead>
                        <tr>
                            <th style="width: 15%;">訂購人</th>
                            <th style="width: 40%;">餐點明細 (數量/備註)</th>
                            <th style="width: 10%;">應付</th>
                            <th style="width: 15%;">已付</th>
                            <th style="width: 10%;">狀態</th>
                            <th style="width: 10%;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="order-table-body">
                        <tr><td colspan="6">請先選擇場次</td></tr>
                    </tbody>
                    <tfoot>
                        <tr style="font-weight: bold; background: #f0f0f0;">
                            <td colspan="2" style="text-align: right;">當前場次合計:</td>
                            <td>$<span id="grand-total-due">0</span></td>
                            <td>$<span id="grand-total-paid">0</span></td>
                            <td colspan="2" style="color: red;">未收: $<span id="grand-total-debt">0</span></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>
        
        <section class="admin-box history-box" style="background: #f9f9f9;">
            <h2>📜 歷史餐廳紀錄</h2>
            <div class="history-container-wrapper">
                <ul id="history-list" class="history-list">
                    <p>正在載入歷史紀錄...</p>
                </ul>
            </div>
        </section>

        <section class="admin-box publish-box">
            <h2>📤 開啟新團購 & 發布菜單</h2>
            <p style="font-size: 0.9rem;">請貼上新的巢狀 JSON 格式。<b>(v13.0: 發布後將新增一個獨立場次)</b></p>
            <textarea id="admin-json-input" placeholder='貼上 JSON (需包含 restaurantName 和 menuCategories): ...'></textarea>
            
            <input type="text" id="admin-map-url" placeholder="🗺️ (選填) 貼上餐廳 Google Maps 連結">

            <div class="time-input-container">
                <label for="deadline-time-input" style="font-weight: bold; font-size: 1.1rem;">⏰ 設定今日截止時間:</label>
                <input type="time" id="deadline-time-input" value="11:30">
            </div>

            <button id="publish-btn" class="btn btn-new-session">🚀 發布新菜單 (開啟新場次)</button>
        </section>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        // v13.0: 引入 addDoc 用於發布新場次
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, collection, query, orderBy, serverTimestamp, where, increment, getDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDCDl7YuEixL8T_0Iemjq9soqqgg_fP0yI",
          authDomain: "cute-lunch-order.firebaseapp.com",
          projectId: "cute-lunch-order",
          storageBucket: "cute-lunch-order.firebasestorage.app",
          messagingSenderId: "62115069448",
          appId: "1:62115069448:web:212231a6452f87a3d69bbd",
          measurementId: "G-DWMWFSHQPX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM
        const sessionSelector = document.getElementById('session-selector');
        const btnDeleteSession = document.getElementById('btn-delete-session');
        const adminRestaurantName = document.getElementById('admin-restaurant-name');
        const currentSessionIdDisplay = document.getElementById('current-session-id');
        const statusBadge = document.getElementById('status-badge');
        const toggleOrderStatusInput = document.getElementById('toggle-order-status');
        const closeOrderHint = document.getElementById('close-order-hint');
        const summaryHeader = document.getElementById('summary-header');
        const aggregatedListEl = document.getElementById('aggregated-order-list');
        const orderTableBody = document.getElementById('order-table-body');
        const grandTotalDueEl = document.getElementById('grand-total-due');
        const grandTotalPaidEl = document.getElementById('grand-total-paid');
        const grandTotalDebtEl = document.getElementById('grand-total-debt');
        const adminJsonInput = document.getElementById('admin-json-input');
        const publishBtn = document.getElementById('publish-btn');
        const historyListEl = document.getElementById('history-list');
        const deadlineTimeInput = document.getElementById('deadline-time-input');
        const deadlineDisplay = document.getElementById('deadline-display');
        const adminMapUrlInput = document.getElementById('admin-map-url');

        let currentSessionDocId = null; // v13.0: 當前選中的場次文件 ID
        let currentSessionData = null;
        let unsubscribeOrders = null;
        let isOrderClosed = false;
        let deadlineDate = null;
        let checkTimer = null;
        let activeSessionsMap = new Map(); // 儲存所有活躍場次的資料

        // --- A. v13.0 新增：監聽所有活躍場次並更新選擇器 ---
        // 這裡監聽新的 activeSessions 集合，而不是舊的 dailyData/menu
        const qActiveSessions = query(collection(db, "activeSessions"), orderBy("createdAt", "desc"));
        onSnapshot(qActiveSessions, (snapshot) => {
            activeSessionsMap.clear();
            sessionSelector.innerHTML = '<option value="">-- 請選擇一個場次 --</option>';
            
            if (snapshot.empty) {
                sessionSelector.innerHTML = '<option value="">(目前沒有活躍場次)</option>';
                resetAdminView();
                return;
            }

            snapshot.forEach(doc => {
                const data = doc.data();
                activeSessionsMap.set(doc.id, data);
                const option = document.createElement('option');
                option.value = doc.id;
                // 顯示餐廳名稱和建立時間
                const createdTime = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '未知時間';
                option.textContent = `${data.restaurantName} (建立於 ${createdTime})`;
                sessionSelector.appendChild(option);
            });

            // 如果當前有選中的場次，嘗試保持選中狀態；否則選中第一個
            if (currentSessionDocId && activeSessionsMap.has(currentSessionDocId)) {
                sessionSelector.value = currentSessionDocId;
                loadSelectedSessionData(currentSessionDocId); // 資料更新時重新載入介面
            } else if (snapshot.size > 0) {
                 // 預設選中最新的場次
                 const firstDocId = snapshot.docs[0].id;
                 sessionSelector.value = firstDocId;
                 loadSelectedSessionData(firstDocId);
            }
        });

        // 監聽選擇器變更事件
        sessionSelector.addEventListener('change', (e) => {
            loadSelectedSessionData(e.target.value);
        });

        // 載入選定場次的資料並更新介面
        function loadSelectedSessionData(docId) {
            currentSessionDocId = docId;
            if (!docId || !activeSessionsMap.has(docId)) {
                resetAdminView();
                return;
            }

            currentSessionData = activeSessionsMap.get(docId);
            
            // 更新介面顯示
            adminRestaurantName.textContent = currentSessionData.restaurantName || '未知餐廳';
            currentSessionIdDisplay.textContent = `場次 ID: ${currentSessionData.sessionId}`;
            statusBadge.style.display = 'inline-block';
            deadlineDisplay.style.display = 'inline-block';
            btnDeleteSession.style.display = 'inline-block'; // 顯示刪除按鈕

            isOrderClosed = currentSessionData.isOrderClosed === true;

            if (currentSessionData.deadlineTimestamp) {
                deadlineDate = currentSessionData.deadlineTimestamp.toDate();
                deadlineDisplay.textContent = `(今日截止: ${deadlineDate.toLocaleString('zh-TW', {hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'})})`;
            } else {
                deadlineDate = null;
                deadlineDisplay.textContent = '(未設定截止時間)';
            }

            startStatusCheck();

            let dateStr = '未知日期';
            if (currentSessionData.createdAt) {
                dateStr = new Date(currentSessionData.createdAt.seconds * 1000).toLocaleString('zh-TW');
            }
            summaryHeader.innerHTML = `訂餐日期: ${dateStr}<br>餐廳電話: ${currentSessionData.restaurantPhone || '(無)'}`;

            // 設定訂單監聽器 (使用該場次的 sessionId)
            setupOrderListener(currentSessionData.sessionId);
        }

        // 重置後台視圖 (當沒有選擇場次時)
        function resetAdminView() {
            currentSessionDocId = null;
            currentSessionData = null;
            adminRestaurantName.textContent = '(請先選擇場次)';
            currentSessionIdDisplay.textContent = '';
            statusBadge.style.display = 'none';
            deadlineDisplay.style.display = 'none';
            btnDeleteSession.style.display = 'none';
            summaryHeader.textContent = '請先選擇場次...';
            aggregatedListEl.innerHTML = '<li>---</li>';
            orderTableBody.innerHTML = '<tr><td colspan="6">請先選擇場次</td></tr>';
            updateFooterStats(0, 0);
            if (checkTimer) clearInterval(checkTimer);
            toggleOrderStatusInput.disabled = true;
            toggleOrderStatusInput.checked = false;
            closeOrderHint.textContent = '(請先選擇場次)';
            if (unsubscribeOrders) unsubscribeOrders();
        }

        function startStatusCheck() {
            if (checkTimer) clearInterval(checkTimer);
            updateStatusUI(); 
            checkTimer = setInterval(updateStatusUI, 1000);
        }

        function updateStatusUI() {
            if (!currentSessionDocId) return;

            let isTimeUp = false;
            if (deadlineDate) {
                const now = new Date();
                if (now >= deadlineDate) isTimeUp = true;
            }

            toggleOrderStatusInput.disabled = false;
            toggleOrderStatusInput.checked = !isOrderClosed;

            if (isOrderClosed) {
                statusBadge.textContent = '⛔ 已結單 (停止點餐)';
                statusBadge.className = 'status-badge status-closed';
                
                if (isTimeUp) {
                    closeOrderHint.innerHTML = '已超過截止時間。<br>將開關撥至「開啟」可強制開放點餐。';
                } else {
                    closeOrderHint.innerHTML = '目前已鎖定。<br>將開關撥至「開啟」即可重新開放點餐。';
                }
            } else {
                if (isTimeUp) {
                    statusBadge.textContent = '⚠️ 開放中 (已超時)';
                    statusBadge.className = 'status-badge';
                    statusBadge.style.background = '#ffeeba';
                    statusBadge.style.color = '#856404';
                    statusBadge.style.border = '2px solid #856404';
                    closeOrderHint.innerHTML = '⚠️ <b>注意：已超過截止時間！</b><br>建議盡快將開關撥至「關閉」以鎖定結單。';
                } else {
                    statusBadge.textContent = '🟢 開放點餐中';
                    statusBadge.className = 'status-badge status-open';
                    closeOrderHint.innerHTML = '前台點餐進行中。<br>將開關撥至「關閉」即可鎖定結單。';
                }
            }
        }

        // --- v13.0 修改：手動開關現在更新選定的特定場次文件 ---
        toggleOrderStatusInput.addEventListener('change', async function() {
            if (!currentSessionDocId) return;
            
            const targetIsClosedState = !this.checked;
            
            let confirmMsg = targetIsClosedState ? "確定要「關閉」點餐嗎？前台將無法再送出訂單。" : "確定要「開啟」點餐嗎？";
            
            if (!targetIsClosedState && deadlineDate && new Date() >= deadlineDate) {
                confirmMsg = "⚠️ 注意：目前已超過截止時間。\n\n確定要「強制開啟」點餐嗎？";
            }

            if (confirm(confirmMsg)) {
                try { 
                    // 更新 activeSessions 集合中的特定文件
                    await updateDoc(doc(db, "activeSessions", currentSessionDocId), { isOrderClosed: targetIsClosedState }); 
                } catch (e) { 
                    alert('操作失敗：' + e.message);
                    this.checked = !this.checked;
                }
            } else {
                this.checked = !this.checked;
            }
        });
        
        // --- v13.0 新增：刪除場次功能 ---
        btnDeleteSession.addEventListener('click', async () => {
            if (!currentSessionDocId || !currentSessionData) return;

            const confirmMsg = `⚠️ 危險操作 ⚠️\n\n您確定要刪除「${currentSessionData.restaurantName}」這個場次嗎？\n\n注意：這只會從列表中移除場次，該場次的訂單紀錄仍然保留在資料庫中，但將無法再透過此介面查看。\n\n請確認是否繼續？`;
            
            if (confirm(confirmMsg)) {
                try {
                    await deleteDoc(doc(db, "activeSessions", currentSessionDocId));
                    alert('場次已刪除。');
                    // 刪除後，onSnapshot 會自動更新，如果沒有場次了會自動重置視圖
                } catch (e) {
                    alert('刪除失敗：' + e.message);
                }
            }
        });


        // --- B. v13.0 修改：發布新菜單改為新增到 activeSessions ---
        publishBtn.addEventListener('click', async () => {
            const jsonString = adminJsonInput.value.trim();
            const deadlineTimeStr = deadlineTimeInput.value;
            const mapUrl = adminMapUrlInput.value.trim();

            if (!jsonString) { alert('請先貼上 JSON！'); return; }
            if (!deadlineTimeStr) { alert('請設定截止時間！'); return; }

            publishBtn.textContent = '正在處理與發布...';
            publishBtn.disabled = true;
            
            const newSessionId = 'session_' + Date.now();
            try {
                const newMenuData = JSON.parse(jsonString);
                const now = new Date();
                const [hours, minutes] = deadlineTimeStr.split(':').map(Number);
                const deadlineDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0);
                
                // v13.0: 不再需要比對舊資料 (comparisonSummary)，因為每次都是全新的場次
                
                const dataToSave = {
                    restaurantName: newMenuData.restaurantName || '未知餐廳',
                    restaurantPhone: newMenuData.restaurantPhone || '',
                    restaurantMapUrl: mapUrl,
                    sessionId: newSessionId,
                    isOrderClosed: false,
                    deadlineTimestamp: Timestamp.fromDate(deadlineDate),
                    createdAt: serverTimestamp() // 使用 createdAt 來排序
                };

                if (newMenuData.menuCategories) dataToSave.menuCategories = newMenuData.menuCategories;
                else if (newMenuData.menuItems) dataToSave.menuItems = newMenuData.menuItems;

                // v13.0: 使用 addDoc 新增到 activeSessions 集合
                await addDoc(collection(db, "activeSessions"), dataToSave);

                // 歷史紀錄部分維持不變
                const historyData = {
                    restaurantName: dataToSave.restaurantName,
                    restaurantPhone: dataToSave.restaurantPhone,
                    restaurantMapUrl: mapUrl,
                    lastUsed: serverTimestamp(),
                    orderCount: increment(1)
                };
                if (newMenuData.menuCategories) historyData.menuCategories = newMenuData.menuCategories;
                else if (newMenuData.menuItems) historyData.menuItems = newMenuData.menuItems;

                await setDoc(doc(db, 'restaurantHistory', dataToSave.restaurantName), historyData, { merge: true });

                alert(`✅ 新場次「${dataToSave.restaurantName}」開啟成功！`);
                adminJsonInput.value = '';
                adminMapUrlInput.value = '';
            } catch (e) { 
                alert('❌ 發布失敗：' + e.message); 
            } finally {
                publishBtn.textContent = '🚀 發布新菜單 (開啟新場次)';
                publishBtn.disabled = false;
            }
        });


        // --- C. 監聽歷史紀錄 (維持不變) ---
        const historyQ = query(collection(db, 'restaurantHistory'), orderBy('lastUsed', 'desc'));
        onSnapshot(historyQ, (snapshot) => {
            historyListEl.innerHTML = '';
            if (snapshot.empty) { historyListEl.innerHTML = '<p>尚無歷史紀錄</p>'; return; }
            snapshot.forEach(doc => {
                const data = doc.data();
                const li = document.createElement('li');
                li.classList.add('history-item');
                li.innerHTML = `
                    <div class="history-info">
                        <strong>${data.restaurantName}</strong> (點過 ${data.orderCount || 1} 次)<br>
                        <span style="font-size: 0.9rem;">電話: ${data.restaurantPhone}</span>
                    </div>
                    <button class="btn btn-load">載入菜單</button>
                `;
                li.querySelector('.btn-load').addEventListener('click', () => {
                    const jsonToLoad = {
                        restaurantName: data.restaurantName,
                        restaurantPhone: data.restaurantPhone,
                    };
                    if (data.menuCategories) jsonToLoad.menuCategories = data.menuCategories;
                    else if (data.menuItems) jsonToLoad.menuItems = data.menuItems;

                    adminJsonInput.value = JSON.stringify(jsonToLoad, null, 2);
                    adminMapUrlInput.value = data.restaurantMapUrl || '';
                    
                    adminJsonInput.scrollIntoView({ behavior: 'smooth' });
                });
                historyListEl.appendChild(li);
            });
        });

        // --- D. 訂單監聽與渲染 (維持不變，但 sessionId 是動態傳入的) ---
        function setupOrderListener(sessionId) {
            if (unsubscribeOrders) unsubscribeOrders();
            // 這裡依然監聽 todayOrders，但透過 sessionId 過濾出當前選擇場次的訂單
            const q = query(collection(db, "todayOrders"), where("sessionId", "==", sessionId), orderBy("orderTime", "desc"));
            unsubscribeOrders = onSnapshot(q, (querySnapshot) => {
                renderOrders(querySnapshot);
            });
        }

        function renderOrders(querySnapshot) {
            orderTableBody.innerHTML = '';
            let currentOrdersData = [];
            let stats = { totalDue: 0, totalPaid: 0 };

            if (querySnapshot.empty) {
                orderTableBody.innerHTML = '<tr><td colspan="6">當前場次尚無訂單</td></tr>';
                aggregatedListEl.innerHTML = '<li>尚未有訂單</li>';
                updateFooterStats(0, 0);
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const order = docSnap.data();
                if (!order.items || !Array.isArray(order.items)) return;
                order.id = docSnap.id;
                currentOrdersData.push(order);

                stats.totalDue += order.totalCost;
                const paidAmount = Number(order.paidAmount) || 0;
                stats.totalPaid += paidAmount;
                const remaining = order.totalCost - paidAmount;
                
                const isFullyPaid = remaining === 0 && order.totalCost > 0;
                let statusHtml = '<span class="status-paid">已付清</span>';
                if (remaining > 0) statusHtml = `<span class="status-debt">未付: $${remaining}</span>`;
                else if (remaining < 0) statusHtml = `<span class="status-change">需找回: $${Math.abs(remaining)}</span>`;

                const tr = document.createElement('tr');
                if (isFullyPaid) tr.classList.add('row-fully-paid');

                const itemsDetails = order.items.map(item => {
                    const qtyStr = item.quantity > 1 ? ` <b>x${item.quantity}</b>` : '';
                    const noteStr = item.note ? ` <span class="item-note">(${item.note})</span>` : '';
            return `${item.name}${qtyStr}${noteStr}`;
        }).join('<br>');

        tr.innerHTML = `
            <td>${order.userAvatar} ${order.userName}</td>
            <td class="text-left">${itemsDetails}</td>
            <td>$${order.totalCost}</td>
            <td><input type="number" class="paid-input" value="${paidAmount}" min="0" onchange="updatePaidAmount('${order.id}', this.value)"></td>
            <td>${statusHtml}</td>
            <td><button class="btn btn-delete" onclick="deleteOrder('${order.id}', '${order.userName}')">❌ 刪除</button></td>
        `;
        orderTableBody.appendChild(tr);
            });
            updateFooterStats(stats.totalDue, stats.totalPaid);
            calculateAggregation(currentOrdersData);
        }

        function updateFooterStats(due, paid) {
            grandTotalDueEl.textContent = due;
            grandTotalPaidEl.textContent = paid;
            const debt = due - paid;
            grandTotalDebtEl.textContent = debt > 0 ? debt : 0;
        }

        window.deleteOrder = async (orderId, userName) => {
            if (confirm(`確定要刪除「${userName}」的訂單嗎？此動作無法復原。`)) {
                try { await deleteDoc(doc(db, "todayOrders", orderId)); } 
                catch (e) { alert('刪除失敗：' + e.message); }
            }
        }

        window.updatePaidAmount = async (orderId, newValue) => {
            const amount = Number(newValue);
            if (isNaN(amount)) { alert('請輸入有效的金額'); return; }
            try { await updateDoc(doc(db, "todayOrders", orderId), { paidAmount: amount }); } 
            catch (e) { alert('更新失敗：' + e.message); }
        }

        function calculateAggregation(orders) {
            const summaryMap = {};
            let totalItemsCount = 0;
            orders.forEach(order => {
                order.items.forEach(item => {
                    const qty = item.quantity || 1;
                    totalItemsCount += qty;
                    if (!summaryMap[item.name]) summaryMap[item.name] = { count: 0, notes: [] };
                    summaryMap[item.name].count += qty;
                    if (item.note) summaryMap[item.name].notes.push(`${qty}份:${item.note}`);
                });
            });
            aggregatedListEl.innerHTML = '';
            if (Object.keys(summaryMap).length === 0) { aggregatedListEl.innerHTML = '<li>當前場次尚無訂單</li>'; return; }
            
            const totalLi = document.createElement('li');
            totalLi.innerHTML = `<strong>📊 總共訂購：${totalItemsCount} 份餐點</strong><hr style="margin: 5px 0; border-top: 1px dashed #ccc;">`;
            aggregatedListEl.appendChild(totalLi);

            for (const [foodName, data] of Object.entries(summaryMap)) {
                const li = document.createElement('li');
                let noteDisplay = data.notes.length > 0 ? `<span class="summary-notes">備註: ${data.notes.join('; ')}</span>` : '';
                li.innerHTML = `<b>${foodName}</b> x ${data.count} 份 ${noteDisplay}`;
                aggregatedListEl.appendChild(li);
            }
        }
    </script>
</body>
</html>
